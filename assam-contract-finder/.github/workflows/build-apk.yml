name: Build Assam Contract Finder APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'assam-contract-finder/**'
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: assam-contract-finder/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: assam-contract-finder-debug-apk
          path: assam-contract-finder/android/app/build/outputs/apk/debug/app-debug.apk
